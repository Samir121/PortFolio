<div class="project-container">
    <mat-grid-list cols="3" gutterSize="16px" rowHeight="1:1">
      <mat-grid-tile *ngFor="let project of projects">
        <mat-card class="project-card">
          <mat-card-header>
            <mat-card-title>{{ project.name }}</mat-card-title>
            <mat-card-subtitle>{{ project.type }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <p>{{ project.description }}</p>
          </mat-card-content>
          <mat-card-actions>
            <a mat-button color="primary" [href]="project.link" target="_blank">
              View
            </a>
          </mat-card-actions>
        </mat-card>
      </mat-grid-tile>
    </mat-grid-list>
  </div>
